<!-- Bulk email to selected users -->
<div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all w-full max-w-lg dark:bg-gray-800"
     role="dialog"
     aria-modal="true"
     aria-labelledby="modal-title">
  <!-- Modal header -->
  <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">{{ _("Email Users") }}</h3>
    <button type="button"
            onclick="closeModal()"
            class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
      <svg class="w-3 h-3"
           aria-hidden="true"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           viewBox="0 0 14 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
      </svg>
    </button>
  </div>
  <!-- Modal body -->
  <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4 dark:bg-gray-800">
    <form hx-post="{{ url_for('admin.send_users_email') }}"
          hx-target="#modal-user"
          hx-swap="innerHTML"
          hx-disabled-elt="find button[type='submit']">
      {% for uid in uids %}<input type="hidden" name="uids" value="{{ uid }}">{% endfor %}
      <p class="mb-4 text-sm text-gray-500 dark:text-gray-400">
        {{ _("Sending to %(count)d user(s):", count=users|length) }}
        {{ users|map(attribute="username")|join(", ") }}
      </p>
      {% if templates %}
        <div class="mb-4">
          <label for="template_picker"
                 class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            {{ _("Load a saved template") }}
          </label>
          <select id="template_picker"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                  onchange="if (this.value) { htmx.ajax('GET', '/users/email-templates/' + this.value, {target: '#compose-fields', swap: 'innerHTML'}); }">
            <option value="">{{ _("— choose a template —") }}</option>
            {% for t in templates %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}
          </select>
        </div>
      {% endif %}
      <div id="compose-fields">{% include "_partials/email_compose_fields.html" %}</div>
      <div class="mt-4 p-3 bg-gray-50 rounded-lg dark:bg-gray-700/50">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox"
                 id="save_as_template"
                 name="save_as_template"
                 value="true"
                 class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary dark:ring-offset-gray-800 dark:bg-gray-700 dark:border-gray-600"
                 onchange="document.getElementById('template_name_wrapper').classList.toggle('hidden', !this.checked)">
          <span class="ml-3 text-sm font-medium text-gray-900 dark:text-white">
            {{ _("Save this message as a reusable template") }}
          </span>
        </label>
        <div id="template_name_wrapper" class="hidden mt-3">
          <input type="text"
                 name="template_name"
                 placeholder="{{ _('Template name') }}"
                 class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>
      </div>
      <!-- Action buttons -->
      <div class="flex items-center justify-end space-x-3 mt-6">
        <button type="button"
                onclick="closeModal()"
                class="px-4 py-2 text-sm font-medium text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-lg dark:bg-gray-600 dark:text-gray-300 dark:hover:bg-gray-700">
          {{ _("Cancel") }}
        </button>
        <button type="submit"
                class="px-4 py-2 text-sm font-medium text-white bg-primary hover:bg-primary_hover disabled:opacity-60 rounded-lg">
          {{ _("Send") }}
        </button>
      </div>
    </form>
  </div>
</div>
